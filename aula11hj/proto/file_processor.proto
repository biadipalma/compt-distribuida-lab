syntax = "proto3";

// Define o namespace para organizar o código gerado e evitar conflitos no C++ e Python
package file_processor;

// Estrutura que carrega uma fração dos bytes do arquivo durante a transmissão em fluxo (streaming)
message FileChunk {
  bytes content = 1;
}

// Estrutura principal de requisição enviada do cliente para o servidor
message FileRequest {
  string file_name = 1;
  FileChunk file_content = 2;

  // 'oneof' garante que apenas um bloco de parâmetros seja enviado na requisição, economizando banda
  oneof parameters {
    CompressPDFRequest compress_pdf_params = 3;
    ConvertToTXTRequest convert_to_txt_params = 4;
    ConvertImageFormatRequest convert_image_format_params = 5;
    ResizeImageRequest resize_image_params = 6;
  }
}

message CompressPDFRequest {}
message ConvertToTXTRequest {}

message ConvertImageFormatRequest {
  string output_format = 1; // Define a extensão de saída desejada (ex: "png", "jpg")
}

message ResizeImageRequest {
  int32 width = 1;
  int32 height = 2;
}

message FileResponse {
  string file_name = 1; // Nome do arquivo gerado/processado
  FileChunk file_content = 2;
  string status_message = 3;
  bool success = 4;
}

// Contrato de comunicação que o servidor deve implementar e o cliente pode consumir
service FileProcessorService {
  // 'stream' em ambos os lados indica streaming bidirecional: arquivos pesados
  // são enviados em pequenos blocos (chunks), evitando estouro de memória nos contêineres.
  rpc CompressPDF (stream FileRequest) returns (stream FileResponse);
  rpc ConvertToTXT (stream FileRequest) returns (stream FileResponse);
  rpc ConvertImageFormat (stream FileRequest) returns (stream FileResponse);
  rpc ResizeImage (stream FileRequest) returns (stream FileResponse);
}
